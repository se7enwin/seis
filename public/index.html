<!-- Warm UP - Few examples of js & jsx syntax-->

<!-- Assign html 5 document type-->
<!DOCTYPE html>
<!-- Main tag - Language-->
<html lang="En">

<head>
    <title> Example React Components from JS and JSX</title>
    <!-- Set all language characters-->
    <meta charset="UTF-8">
    <!-- Assign width screen-->
    <meta name="viewport" containt="width=device-width , initial-scale=1">
    <!-- React remote library -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <!-- React dom remote library -->
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel remote library -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <!-- Js File - Css -->
    <script type="text/javascript" src="css-dom.js"></script>

</head>

<body>
    <!-- Render Tags -->
    <div id="one"></div>
    <div id="two"></div>
    <div id="three"></div>
    <div id="four"></div>
    <div id="root"></div> 
    <!-- Conventional Function -->

    <script>
        function fn() {
            console.log('Conventional Function');
        }
        fn();

    </script>

    <!-- Arrow Function -->
    <script>
        (() => console.log('Arrow Function'))()
    </script>

    <!-- Conventional Class -->
    <script>

        class Cl {

            constructor(atr) {
                this.atr = atr;
            }
            greeting() {

                return console.log(this.atr)
            }
        }
        const object01 = new Cl('Conventional Class');
        object01.greeting();

    </script>

    <!-- Function Component from Js -->
    <script>

        function FnCmJs(props) {

            return React.createElement('h3', null, props)
        }
        // What render
        const tag01 = document.getElementById('one');
        const run01 = ReactDOM.createRoot(tag01);
        // Where render
        run01.render(FnCmJs('Function Component from Js'))

    </script>

    <!-- Class Component from Js -->

    <script>

        class ClCmJs extends React.Component {

            constructor(props) {
                super(props);
            }
            render() {
                return React.createElement('h3', null, this.props);
            }
        }
        // Where render
        const tag02 = document.getElementById('two');
        const run02 = ReactDOM.createRoot(tag02);
        // Class instance
        const object02 = new ClCmJs('Class Component from Js')
        // What render
        run02.render(object02.render());

    </script>

    <!-- Function Component from Jsx -->
    <script type="text/babel">

        function FnCmJsx(props) {

            return (<h3>{props.fnjsx}</h3>)

        }
        // Where render
        const tag03 = document.getElementById('three');
        const run03 = ReactDOM.createRoot(tag03);
        // Text
        const text01 = 'Function Component from Jsx';
        // What render + Attach prop
        run03.render(<FnCmJsx fnjsx={text01} />);

    </script>

    <!-- Class Component from Jsx -->
    <script type="text/babel">

        class ClCmJsx extends React.Component {

            constructor(props) { super(props); }
            render() {
                return (

                    <h3>{this.props.cljsx}</h3>
                )
            }
        }
        // Where render
        const tag04 = document.getElementById('four');
        const run04 = ReactDOM.createRoot(tag04);
        // Text
        const text02 = 'Class Component from Jsx';
        // What render + Attach prop
        run04.render(<ClCmJsx cljsx={text02} />)
    </script>


</body>


</html>
